[project]
name = "yelp-rag"
version = "0.1.0"
description = "Учебный RAG по отзывам Yelp: TF-IDF + semantic (sentence-transformers) с источниками"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "scikit-learn",
    "numpy",
    "scipy",
    "datasets",
    "sentence-transformers",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
